name: fhir-clinical-pipeline

x-warehouse-env: &warehouse-env
  FHIR_BASE_URL: http://fhir:8080/fhir
  WAREHOUSE_HOST: db
  WAREHOUSE_PORT: "5432"
  WAREHOUSE_DB: warehouse
  ETL_USER: etl_user
  ETL_PASSWORD: ${ETL_PASSWORD}
  DBT_USER: dbt_user
  DBT_PASSWORD: ${DBT_PASSWORD}

services:
  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: hapi
      ETL_PASSWORD: ${ETL_PASSWORD}
      DBT_PASSWORD: ${DBT_PASSWORD}
      TABLEAU_PASSWORD: ${TABLEAU_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hapi"]
      interval: 5s
      timeout: 5s
      retries: 20

  fhir:
    image: hapiproject/hapi:v7.0.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hapi
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
    # HAPI only honours the Hibernate dialect from a config file, not env vars
    volumes:
      - ./hapi.application.yaml:/app/config/application.yaml:ro
    ports:
      - "8090:8080"

  airflow:
    build: ./airflow
    image: fhir-clinical-airflow:1.0
    command: standalone
    depends_on:
      db:
        condition: service_healthy
      fhir:
        condition: service_started
    ports:
      - "8091:8080"
    environment:
      <<: *warehouse-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Built at runtime so special characters in the password are URL-encoded
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: >-
        python -c "import os, urllib.parse as p;
        print('postgresql+psycopg2://admin:' + p.quote(os.environ['POSTGRES_ADMIN_PASSWORD'], safe='') + '@db:5432/airflow', end='')"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      PYTHONPATH: /opt/airflow
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_PROJECT_DIR: /opt/airflow/dbt
      DBT_TARGET_PATH: /tmp/dbt_target
      DBT_LOG_PATH: /tmp/dbt_logs
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/pipeline:/opt/airflow/pipeline
      - ./airflow/dbt:/opt/airflow/dbt
      - ./logs:/opt/airflow/logs

volumes:
  postgres_data:
